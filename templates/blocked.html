{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="soft-card p-5 text-center">
      <div class="empty-icon mb-3">⚠</div>
      <h1 class="h3 fw-bold">{{ title }}</h1>
      <p class="text-muted mb-4">{{ message }}</p>
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rounded-pill px-4">Voltar ao início</a>
    </div>
  </div>
</div>
{% endblock %}
